# alembic.ini — Alembic configuration.
# DATABASE_URL is read from Settings (app/core/config.py) at runtime.
# The sqlalchemy.url key here is intentionally NOT a real URL — env.py
# overrides it programmatically. Never hardcode a real DB URL here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder — overridden in env.py via Settings.DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
